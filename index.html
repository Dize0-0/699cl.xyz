<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>WWK | TheReconVPN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Экран входа с переключением RU / EN */
        .click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        .click-overlay .press-hint {
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: lowercase;
            user-select: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .press-hint.fade-out {
            opacity: 0;
            transform: scale(0.96);
        }

        .press-hint.fade-in {
            opacity: 0.85;
            transform: scale(1);
        }

        .click-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Основной блок (сделан чуть шире, чтобы блок с QR отлично вписался) */
        .container {
            max-width: 580px;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.3s;
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            display: block;
            border: 2px solid #2a2a32;
            box-shadow: 0 12px 32px rgba(0,0,0,0.8);
            transition: 0.3s;
        }

        .avatar:hover {
            border-color: #ffffff;
            transform: scale(1.02);
        }

        .profile-name {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .profile-name .username {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Белая галочка */
        .verified-badge {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .verified-badge svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.45));
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .social-icons a {
            color: #8a8a9a;
            font-size: 28px;
            transition: 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .social-icons a:hover {
            color: #ffffff;
            transform: translateY(-3px);
        }

        .social-icons .discord:hover { color: #5865F2; }
        .social-icons .telegram:hover { color: #26A5E4; }
        .social-icons .tiktok:hover { color: #ffffff; }
        .social-icons .youtube:hover { color: #FF0000; }

        .store-info {
            color: #8a8a9a;
            font-size: 13px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* ТОЧНО КАК НА СКРИНЕ: QR слева, текст справа по центру */
        .vpn-section {
            border-top: 1px solid #141418;
            border-bottom: 1px solid #141418;
            padding: 24px 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center; /* Центрирует текст по вертикали относительно QR */
            gap: 24px;
            text-align: left;
        }

        .vpn-qr {
            width: 110px;
            height: 110px;
            background: #ffffff;
            border-radius: 10px;
            padding: 6px;
            flex-shrink: 0;
            object-fit: contain;
        }

        .vpn-details h3 {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .vpn-details h3 a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .vpn-details h3 a:hover {
            color: #26A5E4;
        }

        .vpn-details p {
            color: #8a8a9a;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Цены */
        .setup {
            margin-bottom: 20px;
        }

        .setup p {
            color: #ffffff;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.8;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: space-between;
            max-width: 400px;
            margin: 0 auto;
        }

        .setup p span:first-child {
            color: #a0a0aa;
        }

        .setup p span:last-child {
            color: #ffffff;
        }

        /* Музыкальный трек */
        .track-info {
            border-top: 1px solid #141418;
            padding-top: 16px;
            max-width: 400px;
            margin: 0 auto;
            text-align: left;
        }

        .track-title {
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: #8a8a9a;
            font-size: 11.5px;
            margin-top: 2px;
        }

        @media (max-width: 520px) {
            .container { max-width: 100%; }
            .avatar { width: 110px; height: 110px; }
            .profile-name .username { font-size: 20px; }
            .verified-badge { width: 18px; height: 18px; }
            .social-icons a { font-size: 24px; }
            .vpn-section { flex-direction: column; text-align: center; }
            .vpn-details { text-align: center; }
            .setup p, .track-info { max-width: 280px; }
        }
    </style>
</head>
<body>

<div id="click-overlay" class="click-overlay">
    <span id="hint-text" class="press-hint fade-in">нажми чтобы войти</span>
</div>

<audio id="bg-music" src="music.mp3?v=2" loop></audio>

<div id="main-content" class="container">

    <img class="avatar" src="https://avatars.mds.yandex.net/i?id=59e8220ea8a8b0cd894a964d271707c218ff9d55-12184992-images-thumbs&n=13" alt="WWK" />

    <div class="profile-name">
        <span class="username">wwk</span>
        <div class="verified-badge" title="Verified">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L14.7 4.2L18.1 3.8L19.5 6.9L22.6 8.5L22.2 12L24 14.8L22.2 17.6L22.6 21.1L19.5 22.7L18.1 25.8L14.7 25.4L12 27.6L9.3 25.4L5.9 25.8L4.5 22.7L1.4 21.1L1.8 17.6L0 14.8L1.8 12L1.4 8.5L4.5 6.9L5.9 3.8L9.3 4.2L12 2Z" 
                      transform="scale(0.8) translate(3, -1)" 
                      fill="#ffffff"/>
                <path d="M8.5 12.2L11 14.7L16 9.3" stroke="#000000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <div class="social-icons">
        <a href="https://discord.gg/s2nVtG9nQG" target="_blank" class="discord" title="Discord">
            <i class="fab fa-discord"></i>
        </a>
        <a href="https://t.me/your_support_user" target="_blank" class="telegram" title="Telegram">
            <i class="fab fa-telegram"></i>
        </a>
        <a href="https://www.tiktok.com/@uwwkuq?lang=ru-RU" target="_blank" class="tiktok" title="TikTok">
            <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://www.youtube.com/@uwwkuq" target="_blank" class="youtube" title="YouTube">
            <i class="fab fa-youtube"></i>
        </a>
    </div>

    <div class="store-info">
        Work time: 11:00 — 00:00 MSK
    </div>

    <!-- Блок VPN (QR слева, текст справа ровно по центру) -->
    <div class="vpn-section">
        <img src="qr-code.png" alt="QR TheReconVPNbot" class="vpn-qr">
        <div class="vpn-details">
            <h3><a href="https://t.me/TheReconVPNbot" target="_blank">TheReconVPNbot</a></h3>
            <p>Быстрый и безопасный VPN-сервис. Настройте конфигурации и подключение в пару кликов прямо в Telegram.</p>
        </div>
    </div>

    <div class="setup">
        <p><span>Attack Shark R1</span> <span>€25</span></p>
        <p><span>Attack Shark X68 HE</span> <span>€49</span></p>
    </div>

    <div class="track-info">
        <div class="track-title">ANNA ASTI - Повело</div>
        <div class="track-artist">slowed remix</div>
    </div>

</div>

<script>
    const overlay = document.getElementById('click-overlay');
    const mainContent = document.getElementById('main-content');
    const music = document.getElementById('bg-music');
    const hintText = document.getElementById('hint-text');

    const phrases = ["нажми чтобы войти", "click to enter"];
    let phraseIndex = 0;
    const switchInterval = setInterval(() => {
        hintText.classList.remove('fade-in');
        hintText.classList.add('fade-out');

        setTimeout(() => {
            phraseIndex = (phraseIndex + 1) % phrases.length;
            hintText.textContent = phrases[phraseIndex];
            hintText.classList.remove('fade-out');
            hintText.classList.add('fade-in');
        }, 500);
    }, 2400);

    document.body.addEventListener('click', function() {
        clearInterval(switchInterval);
        if (music.paused) {
            music.play();
            music.volume = 0.5;
        }
        overlay.classList.add('hidden');
        mainContent.classList.add('visible');
        document.body.style.overflow = 'auto';
    }, { once: true });
</script>

</body>
</html>
