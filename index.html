<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>WWK | TheReconVPN</title>
    <!-- Иконка сайта -->
    <link rel="icon" type="image/jpeg" href="https://i.pinimg.com/736x/d2/34/b4/d234b4d14a0bfbeeb4ccf882a4624d2d.jpg">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Экран входа с переключением RU / EN */
        .click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        .click-overlay .press-hint {
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: lowercase;
            user-select: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .press-hint.fade-out {
            opacity: 0;
            transform: scale(0.96);
        }

        .press-hint.fade-in {
            opacity: 0.85;
            transform: scale(1);
        }

        .click-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Основной блок */
        .container {
            max-width: 540px;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.3s;
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Аватарка + индикатор статуса Discord */
        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 2px solid #2a2a32;
            box-shadow: 0 12px 32px rgba(0,0,0,0.8);
            transition: 0.3s;
        }

        .avatar-wrapper:hover .avatar {
            border-color: #ffffff;
            transform: scale(1.02);
        }

        .status-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #747f8d;
            border: 4px solid #000000;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .status-dot.online { background: #23a55a; box-shadow: 0 0 10px rgba(35, 165, 90, 0.6); }
        .status-dot.idle { background: #f0b232; box-shadow: 0 0 10px rgba(240, 178, 50, 0.6); }
        .status-dot.dnd { background: #f23f43; box-shadow: 0 0 10px rgba(242, 63, 67, 0.6); }
        .status-dot.offline { background: #747f8d; }

        .profile-name {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .profile-name .username {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Белая галочка */
        .verified-badge {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .verified-badge svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.45));
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .social-icons a {
            color: #8a8a9a;
            font-size: 27px;
            transition: 0.25s ease;
            text-decoration: none;
            display: inline-block;
        }

        /* Анимация иконок без синего цвета для ТГ */
        .social-icons a:hover {
            color: #ffffff;
            transform: translateY(-3px) scale(1.06);
            filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.25));
        }

        /* Виджет Lanyard (кликабельный переход в ЛС Discord) */
        .lanyard-card {
            background: #0a0a0d;
            border: 1px solid #1a1a22;
            border-radius: 12px;
            padding: 10px 14px;
            margin: 0 auto 18px;
            max-width: 360px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .lanyard-card:hover {
            background: #101015;
            border-color: #383846;
            transform: translateY(-2px);
        }

        .lanyard-icon {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: #14141b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .lanyard-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lanyard-info {
            overflow: hidden;
            flex: 1;
        }

        .lanyard-status-title {
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lanyard-status-sub {
            color: #8a8a9a;
            font-size: 11.5px;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .store-info {
            color: #8a8a9a;
            font-size: 13px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* Кликабельная карточка TheReconVPNbot (строгий Ч/Б стиль без синего) */
        .vpn-card {
            display: flex;
            align-items: center;
            gap: 22px;
            text-align: left;
            text-decoration: none;
            background: #09090c;
            border: 1px solid #181820;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 22px;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }

        .vpn-card:hover {
            background: #111116;
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(255, 255, 255, 0.06);
        }

        .vpn-qr {
            width: 106px;
            height: 106px;
            background: #ffffff;
            border-radius: 10px;
            padding: 6px;
            flex-shrink: 0;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .vpn-card:hover .vpn-qr {
            transform: scale(1.03);
        }

        .vpn-details {
            flex: 1;
        }

        .vpn-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .vpn-details h3 {
            color: #ffffff;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .vpn-details p {
            color: #8a8a9a;
            font-size: 13px;
            line-height: 1.45;
            margin-bottom: 12px;
        }

        .vpn-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            color: #d0d0d8;
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .vpn-card:hover .vpn-btn {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Цены / Девайсы */
        .setup {
            margin-bottom: 20px;
        }

        .setup p {
            color: #ffffff;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.8;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: space-between;
            max-width: 400px;
            margin: 0 auto;
        }

        .setup p span:first-child {
            color: #a0a0aa;
        }

        .setup p span:last-child {
            color: #ffffff;
        }

        /* Музыкальный трек с кнопкой включения */
        .track-info {
            border-top: 1px solid #141418;
            padding-top: 16px;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            gap: 12px;
        }

        .track-text {
            overflow: hidden;
        }

        .track-title {
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: #8a8a9a;
            font-size: 11.5px;
            margin-top: 2px;
        }

        .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0d0d12;
            border: 1px solid #22222a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            transform: scale(1.06);
        }

        .play-btn.playing {
            border-color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }

        @media (max-width: 520px) {
            .container { max-width: 100%; }
            .avatar-wrapper { width: 110px; height: 110px; }
            .profile-name .username { font-size: 20px; }
            .verified-badge { width: 18px; height: 18px; }
            .social-icons a { font-size: 24px; }
            .vpn-card { flex-direction: column; text-align: center; padding: 18px; }
            .vpn-header { justify-content: center; }
            .vpn-details { text-align: center; }
            .setup p, .track-info { max-width: 290px; }
        }
    </style>
</head>
<body>

<div id="click-overlay" class="click-overlay">
    <span id="hint-text" class="press-hint fade-in">нажми чтобы войти</span>
</div>

<!-- Аудио (по умолчанию стоит на паузе, включается кнопкой внизу) -->
<audio id="bg-music" src="music.mp3?v=2" loop></audio>

<div id="main-content" class="container">

    <div class="avatar-wrapper">
        <img class="avatar" id="discord-avatar" src="https://avatars.mds.yandex.net/i?id=59e8220ea8a8b0cd894a964d271707c218ff9d55-12184992-images-thumbs&n=13" alt="WWK" />
        <div id="status-dot" class="status-dot offline" title="Discord Status"></div>
    </div>

    <div class="profile-name">

        <div class="verified-badge" title="Verified">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L14.7 4.2L18.1 3.8L19.5 6.9L22.6 8.5L22.2 12L24 14.8L22.2 17.6L22.6 21.1L19.5 22.7L18.1 25.8L14.7 25.4L12 27.6L9.3 25.4L5.9 25.8L4.5 22.7L1.4 21.1L1.8 17.6L0 14.8L1.8 12L1.4 8.5L4.5 6.9L5.9 3.8L9.3 4.2L12 2Z" 
                      transform="scale(0.8) translate(3, -1)" 
                      fill="#ffffff"/>
                <path d="M8.5 12.2L11 14.7L16 9.3" stroke="#000000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <div class="social-icons">
        <!-- Ссылка сразу на твой профиль/ЛС в Discord -->
        <a href="https://discord.com/users/1228728952865030223" target="_blank" title="Discord ЛС">
            <i class="fab fa-discord"></i>
        </a>
        <a href="https://t.me/your_support_user" target="_blank" title="Telegram">
            <i class="fab fa-telegram"></i>
        </a>
        <a href="https://www.instagram.com/uwwkuq" target="_blank" title="Instagram">

    </div>

    <!-- Виджет Discord Lanyard (при клике тоже открывает твой профиль Discord) -->
    <a href="https://discord.com/users/1228728952865030223" target="_blank" class="lanyard-card" id="lanyard-card" title="Открыть профиль Discord">
        <div class="lanyard-icon" id="lanyard-icon">
            <i class="fab fa-discord"></i>
        </div>
        <div class="lanyard-info">
            <div class="lanyard-status-title" id="lanyard-title">Discord</div>
            <div class="lanyard-status-sub" id="lanyard-sub">Загрузка статуса...</div>
        </div>

    <div class="store-info">
        Work time: 11:00 — 00:00 MSK
    </div>

    <!-- Кликабельная карточка TheReconVPNbot (без синего цвета) -->
    <a href="https://t.me/TheReconVPNbot" target="_blank" class="vpn-card">
        <img src="qrcode.png" alt="QR TheReconVPNbot" class="vpn-qr">

    <div class="setup">
        <p><span>Attack Shark R1</span> <span>€25</span></p>
        <p><span>Attack Shark X68 HE</span> <span>€49</span></p>
    </div>

    <!-- Плеер: по умолчанию выключен, можно включить по кнопке -->

        <div class="track-text">

        <button id="play-toggle" class="play-btn" title="Включить / выключить музыку">
            <i id="play-icon" class="fas fa-play"></i>
        </button>
    </div>

</div>

<script>
    // ======= 1. LANYARD API (ТВОЙ DISCORD ID) =======
    const DISCORD_USER_ID = "1228728952865030223";

    const statusDot = document.getElementById('status-dot');
    const lanyardTitle = document.getElementById('lanyard-title');
    const lanyardSub = document.getElementById('lanyard-sub');
    const lanyardIcon = document.getElementById('lanyard-icon');

    const statusNames = {
        online: "В сети",
        idle: "Не активен",
        dnd: "Не беспокоить",
        offline: "Не в сети"
    };

    function updateLanyardUI(data) {
        if (!data) return;

        const status = data.discord_status || 'offline';
        statusDot.className = `status-dot ${status}`;

        const dUser = data.discord_user;
        const displayName = dUser ? (dUser.global_name || dUser.username) : "Discord";

        const activities = data.activities || [];
        const customStatus = activities.find(a => a.type === 4);
        const mainActivity = activities.find(a => a.type !== 4);

        if (data.listening_to_spotify && data.spotify) {
            lanyardTitle.textContent = `${displayName} • Spotify`;
            lanyardSub.textContent = `${data.spotify.artist} — ${data.spotify.song}`;
            lanyardIcon.innerHTML = `<img src="${data.spotify.album_art_url}" alt="Spotify">`;
        } else if (mainActivity) {
            lanyardTitle.textContent = mainActivity.name;
            lanyardSub.textContent = mainActivity.details || mainActivity.state || statusNames[status];

            if (mainActivity.assets && mainActivity.assets.large_image) {
                let imgUrl = mainActivity.assets.large_image;
                if (imgUrl.startsWith("mp:external/")) {
                    imgUrl = `https://media.discordapp.net/external/${imgUrl.replace("mp:external/", "")}`;
                } else {
                    imgUrl = `https://cdn.discordapp.com/app-assets/${mainActivity.application_id}/${imgUrl}.png`;
                }
                lanyardIcon.innerHTML = `<img src="${imgUrl}" alt="Activity">`;
            } else {
                lanyardIcon.innerHTML = `<i class="fas fa-gamepad"></i>`;
            }
        } else {
            lanyardTitle.textContent = `${displayName} (${statusNames[status] || "Не в сети"})`;
            lanyardSub.textContent = (customStatus && customStatus.state) ? customStatus.state : "Написать в Discord ↗";
            if (dUser && dUser.avatar) {
                lanyardIcon.innerHTML = `<img src="https://cdn.discordapp.com/avatars/${dUser.id}/${dUser.avatar}.png?size=64" alt="Avatar">`;
            } else {
                lanyardIcon.innerHTML = `<i class="fab fa-discord"></i>`;
            }
        }
    }

    function connectLanyard() {
        const ws = new WebSocket("wss://api.lanyard.rest/socket");
        let heartbeatInterval;

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            if (msg.op === 1) {
                ws.send(JSON.stringify({
                    op: 2,
                    d: { subscribe_to_id: DISCORD_USER_ID }
                }));

                heartbeatInterval = setInterval(() => {
                    ws.send(JSON.stringify({ op: 3 }));
                }, msg.d.heartbeat_interval);
            } else if (msg.op === 0) {
                if (msg.t === "INIT_STATE" || msg.t === "PRESENCE_UPDATE") {
                    updateLanyardUI(msg.d);
                }
            }
        };

        ws.onerror = () => {
            lanyardTitle.textContent = "Discord";
            lanyardSub.textContent = "Открыть профиль ↗";
        };

        ws.onclose = () => {
            clearInterval(heartbeatInterval);
            setTimeout(connectLanyard, 5000);
        };
    }

    connectLanyard();

    // ======= 2. КНОПКА ВКЛЮЧЕНИЯ / ВЫКЛЮЧЕНИЯ МУЗЫКИ =======
    const music = document.getElementById('bg-music');
    const playToggle = document.getElementById('play-toggle');
    const playIcon = document.getElementById('play-icon');
    music.volume = 0.5;

    playToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        if (music.paused) {
            music.play();
            playIcon.className = 'fas fa-pause';
            playToggle.classList.add('playing');
        } else {
            music.pause();
            playIcon.className = 'fas fa-play';
            playToggle.classList.remove('playing');
        }
    });

    // ======= 3. ЭКРАН ВХОДА (НЕ ЗАПУСКАЕТ МУЗЫКУ САМ) =======
    const overlay = document.getElementById('click-overlay');
    const mainContent = document.getElementById('main-content');
    const hintText = document.getElementById('hint-text');

    const phrases = ["нажми чтобы войти", "click to enter"];
    let phraseIndex = 0;
    const switchInterval = setInterval(() => {
        hintText.classList.remove('fade-in');
        hintText.classList.add('fade-out');

        setTimeout(() => {
            phraseIndex = (phraseIndex + 1) % phrases.length;
            hintText.textContent = phrases[phraseIndex];
            hintText.classList.remove('fade-out');
            hintText.classList.add('fade-in');
        }, 500);
    }, 2400);

    overlay.addEventListener('click', function() {
        clearInterval(switchInterval);
        overlay.classList.add('hidden');
        mainContent.classList.add('visible');
        document.body.style.overflow = 'auto';
    }, { once: true });
</script>

</body>
