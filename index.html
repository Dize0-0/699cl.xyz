<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>WWK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden; /* Запрещаем скролл до входа */
        }

        /* --- Стили для стартового экрана с кнопкой --- */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .start-btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid #2a2a32;
            padding: 15px 40px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        /* Анимация при наведении на кнопку */
        .start-btn:hover {
            border-color: #5a5aff;
            background: rgba(90, 90, 255, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(90, 90, 255, 0.2);
        }

        .start-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }
        /* ----------------------------------------------- */

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            opacity: 0; /* Скрываем контент до клика */
            transform: translateY(20px);
            transition: all 1s ease 0.3s;
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 30px;
            display: block;
            border: 2px solid #2a2a32;
            box-shadow: 0 12px 32px rgba(0,0,0,0.8);
            transition: 0.3s;
        }

        .avatar:hover {
            border-color: #5a5aff;
            transform: scale(1.02);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .social-icons a {
            color: #8a8a9a;
            font-size: 30px;
            transition: 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .social-icons a:hover {
            color: #ffffff;
            transform: translateY(-3px);
        }

        .social-icons .discord:hover { color: #5865F2; }
        .social-icons .telegram:hover { color: #26A5E4; }
        .social-icons .tiktok:hover { color: #ffffff; }
        .social-icons .youtube:hover { color: #FF0000; }

        .store-info {
            color: #8a8a9a;
            font-size: 13px;
            margin-bottom: 22px;
            letter-spacing: 0.5px;
        }

        .setup {
            border-top: 1px solid #141418;
            padding-top: 22px;
            margin-bottom: 22px;
        }

        .setup p {
            color: #ffffff;
            font-size: 14px;
            font-weight: 400;
            line-height: 2;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: space-between;
            max-width: 320px;
            margin: 0 auto;
        }

        .setup p span:first-child {
            color: #a0a0aa;
        }

        .setup p span:last-child {
            color: #ffffff;
        }

        .track-info {
            border-top: 1px solid #141418;
            padding-top: 18px;
            max-width: 320px;
            margin: 0 auto;
            text-align: left;
        }

        .track-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: #8a8a9a;
            font-size: 12px;
            margin-top: 3px;
        }

        @media (max-width: 480px) {
            .avatar { width: 110px; height: 110px; }
            .social-icons a { font-size: 26px; }
            .setup p { font-size: 13px; max-width: 280px; }
            .track-info { max-width: 280px; }
        }
    </style>
</head>
<body>

<!-- Стартовый экран с кнопкой -->
<div id="start-screen" class="start-screen">
    <button id="start-btn" class="start-btn">Enter</button>
</div>

<!-- Аудиофайл -->
<audio id="bg-music" src="music.mp3" loop></audio>

<!-- Основной контент сайта -->
<div id="main-content" class="container">

    <!-- Убедись, что картинка называется именно так и лежит в папке на GitHub -->
    <img class="avatar" src="avatar.jpg" alt="WWK" />

    <div class="social-icons">
        <a href="https://discord.gg/s2nVtG9nQG" target="_blank" class="discord" title="Discord">
            <i class="fab fa-discord"></i>
        </a>
        <a href="https://t.me/your_support_user" target="_blank" class="telegram" title="Telegram">
            <i class="fab fa-telegram"></i>
        </a>
        <a href="https://www.tiktok.com/@uwwkuq?lang=ru-RU" target="_blank" class="tiktok" title="TikTok">
            <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://www.youtube.com/@uwwkuq" target="_blank" class="youtube" title="YouTube">
            <i class="fab fa-youtube"></i>
        </a>
    </div>

    <div class="store-info">
        Work time: 11:00 — 00:00 MSK
    </div>

    <div class="setup">
        <p><span>Attack Shark R1</span> <span>€25</span></p>
        <p><span>Attack Shark X68 HE</span> <span>€49</span></p>
    </div>

    <div class="track-info">
        <div class="track-title">ANNA ASTI - Повело</div>
        <div class="track-artist">slowed remix</div>
    </div>

</div>

<!-- Скрипт логики клика по кнопке -->
<script>
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const mainContent = document.getElementById('main-content');
    const music = document.getElementById('bg-music');

    // Теперь мы слушаем клик именно по кнопке, а не по всему экрану
    startBtn.addEventListener('click', function() {
        // Запускаем музыку
        if (music.paused) {
            music.play();
            music.volume = 0.5; // Громкость 50%
        }
        
        // Прячем черный экран с кнопкой
        startScreen.classList.add('hidden');
        
        // Плавно показываем профиль
        mainContent.classList.add('visible');
        
        // Разрешаем скролл
        document.body.style.overflow = 'auto';
    });
</script>

</body>
</html>
