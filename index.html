<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>WWK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 30px;
            display: block;
            border: 2px solid #2a2a32;
            box-shadow: 0 12px 32px rgba(0,0,0,0.8);
            transition: 0.3s;
        }

        .avatar:hover {
            border-color: #5a5aff;
            transform: scale(1.02);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .social-icons a {
            color: #8a8a9a;
            font-size: 30px;
            transition: 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .social-icons a:hover {
            color: #ffffff;
            transform: translateY(-3px);
        }

        .social-icons .discord:hover { color: #5865F2; }
        .social-icons .telegram:hover { color: #26A5E4; }
        .social-icons .tiktok:hover { color: #ffffff; }
        .social-icons .youtube:hover { color: #FF0000; }

        .setup {
            border-top: 1px solid #141418;
            padding-top: 22px;
        }

        .setup p {
            color: #ffffff;
            font-size: 14px;
            font-weight: 400;
            line-height: 2;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: space-between;
            max-width: 320px;
            margin: 0 auto;
        }

        .setup p span:first-child {
            color: #a0a0aa;
        }

        .setup p span:last-child {
            color: #ffffff;
        }

        @media (max-width: 480px) {
            .avatar { width: 110px; height: 110px; }
            .social-icons a { font-size: 26px; }
            .setup p { font-size: 13px; max-width: 280px; }
        }
    </style>
</head>
<body>

<div class="container">

    <img class="avatar" src="https://avatars.mds.yandex.net/i?id=59e8220ea8a8b0cd894a964d271707c218ff9d55-12184992-images-thumbs&n=13" alt="WWK" />

    <div class="social-icons">
        <a href="https://discord.gg/s2nVtG9nQG" target="_blank" class="discord" title="Discord">
            <i class="fab fa-discord"></i>
        </a>
        <a href="https://t.me/your_support_user" target="_blank" class="telegram" title="Telegram">
            <i class="fab fa-telegram"></i>
        </a>
        <a href="https://www.tiktok.com/@uwwkuq?lang=ru-RU" target="_blank" class="tiktok" title="TikTok">
            <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://www.youtube.com/@uwwkuq" target="_blank" class="youtube" title="YouTube">
            <i class="fab fa-youtube"></i>
        </a>
    </div>

    <div class="setup">
        <p><span>Attack Shark R1</span> <span>€25</span></p>
        <p><span>Attack Shark X68 HE</span> <span>€49</span></p>
    </div>

</div>

</body>
</html>
